<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Toolbar-size variant: full-bleed disc and two sliders so it stays legible at 16px and 32px. -->
  <circle cx="8" cy="8" r="8" fill="#ff0033"/>
  <g stroke="#fff" stroke-width="1.5" stroke-linecap="round">
    <line x1="3.75" y1="5.5" x2="12.25" y2="5.5"/>
    <line x1="3.75" y1="10.5" x2="12.25" y2="10.5"/>
  </g>
  <g fill="#fff" stroke="#ff0033" stroke-width="0.75">
    <circle cx="10" cy="5.5" r="2.1"/>
    <circle cx="6" cy="10.5" r="2.1"/>
  </g>
</svg>
